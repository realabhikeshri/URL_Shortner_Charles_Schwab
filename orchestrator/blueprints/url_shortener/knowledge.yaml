# Knowledge base for the deterministic RequirementAnalyst (offline stand-in for the LLM).
# Vague terms raise ambiguities; capability keywords map requirement text to catalog capabilities.

ambiguity_threshold: 0.35
impact_weights: {low: 0.1, medium: 0.25, high: 0.4}

vague_terms:
  - term: enterprise-ready
    pattern: 'enterprise[- ]?(ready|grade)'
    impact: high
    question: Which enterprise capabilities are in scope (authentication, rate limiting, caching, observability, SSO, multi-tenancy)?
    default_assumption: >-
      Interpret as read-through caching of redirects, per-client rate limiting and Prometheus metrics.
      Authentication changes the public API contract, so it is NOT assumed; it is raised as open question Q-1.
    implies: [caching, rate_limiting, observability]
    open_question: "Q-1: Is API-key authentication required on write endpoints?"
  - term: faster
    pattern: '\bfast(er)?\b|\bspeed\b|\bquick(er)?\b'
    impact: medium
    question: Faster for which endpoint, by how much, and under what load?
    default_assumption: >-
      Target the redirect hot path - p95 latency under 50 ms with 20 concurrent clients on a developer
      laptop (SQLite), measured by scripts/loadcheck.py and enforced as a gate.
    implies: [caching, performance]
    open_question: "Q-2: Is there a production SLO (p95/p99, RPS) that should replace the laptop target?"
  - term: scalable
    pattern: '\bscal(able|e|ability)\b'
    impact: medium
    question: What load (requests per second, number of links) must the service sustain?
    default_assumption: Horizontal scaling behind a load balancer with shared Redis and Postgres.
    implies: [caching]
  - term: secure
    pattern: '\b(more|make it|be)\s+secure\b'   # a request to "be secure", not "security review"
    impact: high
    question: Which threats and controls are in scope (authn, authz, abuse prevention, audit)?
    default_assumption: API-key authentication on writes plus rate limiting.
    implies: [api_key_auth, rate_limiting]

capability_keywords:
  core: ['create, redirect', 'url shortener with create', 'redirect, metadata']
  alias_case_fix: ['case-sensitive', 'case sensitive', 'case-insensitive']
  expiry: ['expiry', 'expires_at', 'expiration', 'expire']
  analytics: ['analytics', 'stats endpoint', 'unique visitors', 'referrer']
  caching: ['cach(e|ing)', 'read-through']
  rate_limiting: ['rate[- ]limit', 'token bucket', 'throttl']
  observability: ['prometheus', '/metrics', 'observability']
  performance: ['p95', 'latency target']
  api_key_auth: ['api[- ]key auth', 'api-key authentication', 'x-api-key', 'authentication on all write']

# Resolves open questions when later requirement text answers them.
resolved_question_credit: 0.15   # each answered open question lowers the ambiguity score
answers:
  "Q-1: Is API-key authentication required on write endpoints?": api_key_auth
