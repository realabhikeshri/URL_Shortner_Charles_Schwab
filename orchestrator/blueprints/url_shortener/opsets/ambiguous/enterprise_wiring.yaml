summary: Wire read-through cache, rate limits and metrics into config, app, routes and LinkService
rationale: Redirects resolve through a read-through cache keyed by canonical code (aliases look up their
  lower-case entry; only canonical misses are negatively cached), invalidated on create/update/delete.
  Cache errors degrade to the database. Writes and redirects are rate limited per client; readiness now
  covers the cache; /metrics exposes request, redirect, cache, rate-limit and analytics gauges. Adds redis
  and prometheus-client as runtime dependencies (approval required).
alternatives:
- 'Cache the full Link row: rejected, larger payloads and more invalidation surface'
- 'Write-through cache: rejected, invalidation is simpler and links change rarely'
