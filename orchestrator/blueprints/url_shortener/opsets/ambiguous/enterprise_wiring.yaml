                    await self._cache_set(f"link:{code}", MISSING, self.settings.cache_negative_ttl_s)
                return None
            resolved = Resolved.from_link(link)
            await self._cache_set(f"link:{link.code}", resolved.to_json(), self.settings.cache_ttl_s)
            return resolved

