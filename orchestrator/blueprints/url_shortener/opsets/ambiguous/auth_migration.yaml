summary: Migration 0003 - api_keys table and links.owner_key_id (FK, SET NULL)
rationale: Additive and reversible. Existing links keep owner_key_id NULL (no owner) so they remain manageable
  after auth is enabled; new links record the creating key.
alternatives:
- 'Backfill an owner for existing links: rejected, no truthful owner exists'
