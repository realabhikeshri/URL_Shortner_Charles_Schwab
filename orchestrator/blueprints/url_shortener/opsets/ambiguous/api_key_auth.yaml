summary: X-API-Key required on write endpoints; keys SHA-256 hashed at rest; owner-only modification;
  key CLI
rationale: Opaque 256-bit keys with an indexed prefix, compared in constant time, revocable, never logged.
  Writes are rate limited per key. Only the creating key may PATCH/DELETE a link (403 otherwise). Redirects,
  metadata and stats stay public. Existing tests are updated to authenticate.
alternatives:
- 'JWT bearer tokens: rejected, needs an issuer and key rotation story for no added value here'
- 'bcrypt/argon2 for key hashes: rejected, unnecessary for high-entropy random keys and slow per request'
