summary: Click analytics off the hot path (bounded queue + batch writer), stats endpoint, retention purge
rationale: The redirect only enqueues (put_nowait) and never awaits analytics I/O; a background writer
  batches inserts and a purger enforces analytics_retention_days. Unique visitors use a daily-salted HMAC
  so no PII is stored and hashes cannot be correlated across days. Failures are counted and logged without
  PII and never propagate to the redirect.
alternatives:
- 'FastAPI BackgroundTasks per request: rejected, no batching or back-pressure, one insert per click'
- 'External queue (Kafka/SQS): deferred, documented scaling path'
ops:
- op: replace
  path: service/api/redirect.py
  old: |+
    # lineage: REQ-GF-001 / implement.links_api (see runs/ for the decision trail)
    """Public redirect endpoint (registered last so fixed routes win)."""

    from typing import Annotated

    from fastapi import APIRouter, Depends, Path
    from fastapi.responses import RedirectResponse

    from service.api.deps import get_link_service
    from service.links import LinkService

    router = APIRouter(tags=["redirect"])


  new: |+
    # lineage: REQ-GF-001 / implement.links_api, REQ-BF-002 / implement.analytics
    """Public redirect endpoint (registered last so fixed routes win)."""

    from typing import Annotated

    from fastapi import APIRouter, Depends, Path, Request
    from fastapi.responses import RedirectResponse

    from service.analytics import ClickEvent
    from service.api.deps import get_link_service
    from service.db import utcnow
    from service.links import LinkService
    from service.observability import get_logger

    router = APIRouter(tags=["redirect"])
    log = get_logger("redirect")


    def record_click(request: Request, link_id: int) -> None:
        """Hand the click to the background recorder; never raises (analytics cannot fail redirects)."""
        try:
            recorder = getattr(request.app.state, "recorder", None)
            if recorder is None:
                return
            recorder.record(
                ClickEvent(
                    link_id=link_id,
                    occurred_at=utcnow(),
                    ip=request.client.host if request.client else "",
                    user_agent=request.headers.get("user-agent", ""),
                    referrer=request.headers.get("referer"),
                )
            )
        except Exception as exc:
            log.warning("click not recorded", extra={"error": type(exc).__name__})


