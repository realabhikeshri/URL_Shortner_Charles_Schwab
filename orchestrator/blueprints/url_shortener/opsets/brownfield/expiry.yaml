summary: Optional expires_at on create/PATCH; expired links return 410; metadata reports is_expired
rationale: Expiry is evaluated at read time against UTC now, so no scheduler is required and behaviour
  is exact. expires_at must be timezone-aware and in the future; PATCH with null clears it.
alternatives:
- 'Background job flipping a flag: rejected, adds moving parts and a lag window'
